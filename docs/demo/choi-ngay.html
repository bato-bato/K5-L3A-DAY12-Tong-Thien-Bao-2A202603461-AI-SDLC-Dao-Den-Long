p(16px,4vw,72px);display:flex;gap:22px;font-size:14px;text-shadow:0 1px 5px #000}kbd{font:600 13px system-ui;background:#142735b8;border:1px solid #c9cbc26b;border-radius:4px;padding:3px 6px;margin-right:3px}#hud{top:90px;left:clamp(16px,3vw,48px);display:flex;gap:16px;background:#142834df;border:1px solid #e8deba40;border-radius:10px;padding:10px 18px}#hud small,#hud strong{display:block}#hud strong{color:#ffd28b}#prompt{bottom:65px;left:50%;transform:translate(-50%);border-radius:12px;background:#162834e8;padding:10px 18px;white-space:nowrap}dialog{border:1px solid #dbb781;border-radius:15px;background:#172e39;color:#ffe6b6;padding:28px;max-width:min(90vw,420px)}dialog::backdrop{background:#0a192a98}dialog h2{font:32px Times New Roman,serif;margin:0}#touch{bottom:18px;left:15px;right:15px;align-items:end;justify-content:space-between;pointer-events:none}#touch button{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;width:48px;height:48px;font:600 14px system-ui}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:3px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-row:2}.pad button:nth-child(3),.pad button:nth-child(4){grid-row:2}#touch>div:last-child{display:flex;gap:7px}[hidden]{display:none!important}@media(pointer:coarse){#touch:not([hidden]){display:flex}footer{display:none}#prompt{bottom:130px}}@media(pointer:fine){#touch{display:none}}@media(max-width:550px){.panel{top:50%;right:22px}.panel p{max-width:265px}footer{gap:8px;font-size:12px}.chapter{font-size:12px}#prompt{font-size:14px;white-space:normal;text-align:center;width:max-content;max-width:90%}}#hud{flex-wrap:wrap;max-width:calc(100% - 32px)}#hud strong{font-variant-numeric:tabular-nums}@media(max-width:550px){#hud{gap:10px;padding:7px 10px;top:70px}#hud small{font-size:12px}.brand{font-size:18px}#touch>div:last-child{gap:3px}}:root{--gold:#f2c14e;--danger:#ff5a5f;--ink:#0e1430;--text:#f5f1e6}body{color:var(--text);background:var(--ink)}.primary{background:var(--gold);color:var(--ink)}#hud{inset:20px 3% auto;display:grid;grid-template-columns:1fr 1.4fr 1fr;background:transparent;border:0;padding:0;gap:0;pointer-events:none}#hud>div{background:#0e1430e8;border:1px solid #f2c14e70;padding:4px 12px;border-radius:7px;width:max-content}#hud>div:nth-child(1){grid-column:3;grid-row:1;justify-self:end}#hud>div:nth-child(2){position:fixed;bottom:58px;left:50%;transform:translate(-50%);width:auto;text-align:center}#hud>div:nth-child(3){grid-column:1;grid-row:1}#hud>div:nth-child(4){grid-column:2;grid-row:1;justify-self:center;text-align:center}#hud>div:nth-child(5){grid-column:3;grid-row:2;justify-self:end}#hud strong{color:var(--gold)}#hud .urgent strong{color:var(--danger);animation:blink .7s infinite alternate}@keyframes blink{to{opacity:.45}}#game.play header{top:82px;justify-content:flex-start}#game.play header .brand{display:none}.toolbar{gap:5px}#abilities,#guide,#weather{position:absolute;z-index:1;background:#0e1430d9;padding:6px 12px;border-radius:8px;font-size:14px}#abilities{bottom:17px;right:3%}#guide{right:3%;top:42%;color:var(--gold)}#weather{top:94px;left:50%;transform:translate(-50%);color:var(--danger)}#guide i{display:inline-block;font-style:normal}#bag{letter-spacing:.1em}#prompt{bottom:122px}#actions{display:flex;gap:8px;flex-wrap:wrap}#actions button{padding:9px 15px}#sliders label{display:block;margin:14px 0}#sliders input{display:block;width:100%}@media(max-width:940px){#legend{bottom:8px;font-size:11px;gap:5px}#abilities{bottom:95px}#hud>div:nth-child(2){bottom:47px}}@media(pointer:coarse){#abilities{bottom:132px}#hud>div:nth-child(2){bottom:105px}#prompt{bottom:180px}#touch>div:last-child{display:grid;grid-template-columns:repeat(2,48px)}}.accessible{--danger:#fff}.accessible .urgent strong:before,.accessible #weather:before{content:"⚠ "}.accessible #weather,.accessible #hud .urgent strong{color:#fff}#sliders input[type=checkbox]{display:inline;width:auto}
