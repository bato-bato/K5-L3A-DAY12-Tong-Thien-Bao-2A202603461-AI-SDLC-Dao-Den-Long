ry{background:var(--gold);color:var(--ink)}#hud{inset:20px 3% auto;display:grid;grid-template-columns:1fr 1.4fr 1fr;background:transparent;border:0;padding:0;gap:0;pointer-events:none}#hud>div{background:#0e1430e8;border:1px solid #f2c14e70;padding:4px 12px;border-radius:7px;width:max-content}#hud>div:nth-child(1){grid-column:3;grid-row:1;justify-self:end}#hud>div:nth-child(2){position:fixed;bottom:58px;left:50%;transform:translate(-50%);width:auto;text-align:center}#hud>div:nth-child(3){grid-column:1;grid-row:1}#hud>div:nth-child(4){grid-column:2;grid-row:1;justify-self:center;text-align:center}#hud>div:nth-child(5){grid-column:3;grid-row:2;justify-self:end}#hud strong{color:var(--gold)}#hud .urgent strong{color:var(--danger);animation:blink .7s infinite alternate}@keyframes blink{to{opacity:.45}}#game.play header{top:82px;justify-content:flex-start}#game.play header .brand{display:none}.toolbar{gap:5px}#abilities,#guide,#weather{position:absolute;z-index:1;background:#0e1430d9;padding:6px 12px;border-radius:8px;font-size:14px}#abilities{bottom:17px;right:3%}#guide{right:3%;top:42%;color:var(--gold)}#weather{top:94px;left:50%;transform:translate(-50%);color:var(--danger)}#guide i{display:inline-block;font-style:normal}#bag{letter-spacing:.1em}#prompt{bottom:122px}#actions{display:flex;gap:8px;flex-wrap:wrap}#actions button{padding:9px 15px}#sliders label{display:block;margin:14px 0}#sliders input{display:block;width:100%}@media(max-width:940px){#legend{bottom:8px;font-size:11px;gap:5px}#abilities{bottom:95px}#hud>div:nth-child(2){bottom:47px}}@media(pointer:coarse){#abilities{bottom:132px}#hud>div:nth-child(2){bottom:105px}#prompt{bottom:180px}#touch>div:last-child{display:grid;grid-template-columns:repeat(2,48px)}}.accessible{--danger:#fff}.accessible .urgent strong:before,.accessible #weather:before{content:"⚠ "}.accessible #weather,.accessible #hud .urgent strong{color:#fff}#sliders input[type=checkbox]{display:inline;width:auto}
</style>
</head>
<body><main id="game"><canvas id="world" aria-label="Đảo đèn lồng 3D"></canvas>
<header><span class="brand"><span class="seal" aria-hidden="true">燈</span>Đảo Đèn Lồng</span><div class="toolbar"><button id="sound" aria-label="Bật âm thanh" title="Bật âm thanh">♪</button><button id="pause" aria-label="Tạm dừng" hidden>Ⅱ</button><button id="help" aria-label="Cách chơi" title="Cách chơi">?</button></div></header>
<section id="menu" class="panel"><div class="chapter">Đèn cạn dầu</div><h1>Đảo<br><em>Đèn Lồng</em></h1><p id="intro">Cùng Mây gom những đốm sáng giữa màn sương và giữ đèn sáng đến bình minh.</p><button class="primary" id="start">Bắt đầu <span aria-hidden="true">✦</span></button></section>
<div id="hud" hidden><div><small>Đèn đã thắp</small><strong id="count"></strong></div><div><small>Đom đóm</small><strong id="bag"></strong></div><div><small>Lửa sống</small><strong id="life"></strong></div><div><small>Còn lại</small><strong id="timer"></strong></div><div><small>Điểm</small><strong id="score"></strong></div></div>
<div id="abilities" hidden></div><div id="guide" hidden></div><div id="weather" hidden></div><div id="prompt" role="status" hidden></div><footer id="legend"><span><kbd>W A S D</kbd> Di chuyển</span><span><kbd>Space</kbd> Nhảy</span><span><kbd>Shift</kbd> Lướt</span><span><kbd>E</kbd> Nạp đèn</span><span><kbd>F</kbd> Tỏa sáng</span></footer>
<div id="touch" hidden><div class="pad"><button data-key="KeyW" aria-label="Tiến">▲</button><button data-key="KeyA" aria-label="Trái">◀</button><button data-key="KeyS" aria-label="Lùi">▼</button><button data-key="KeyD" aria-label="Phải">▶</button></div><div><button data-key="ShiftLeft">Lướt</button><button data-key="Space">Nhảy</button><button data-key="KeyE">Nạp</button><button data-key="KeyF">Tỏa</button></div></div>
<dialog id="dialog"><h2></h2><p></p><div id="sliders" hidden><label><input type="checkbox" id="palette"> Bảng màu dễ phân biệt</label><label>Âm lượng <input id="volume" type="range" min="0" max="100"></label><label>Độ nhạy chuột <input id="sensitivity" type="range" min="1" max="10"></label></div><div id="actions"></div></dialog>
</main></body></html>
