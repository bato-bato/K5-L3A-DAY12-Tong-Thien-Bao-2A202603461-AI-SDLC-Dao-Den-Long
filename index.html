<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14242f"><title>Đảo Đèn Lồng</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/src/style.css"></head>
<body><main id="game"><canvas id="world" aria-label="Đảo đèn lồng 3D"></canvas>
<header><span class="brand"><span class="seal" aria-hidden="true">燈</span>Đảo Đèn Lồng</span><div class="toolbar"><button id="sound" aria-label="Bật âm thanh" title="Bật âm thanh">♪</button><button id="pause" aria-label="Tạm dừng" hidden>Ⅱ</button><button id="help" aria-label="Cách chơi" title="Cách chơi">?</button></div></header>
<section id="menu" class="panel"><div class="chapter">Đèn cạn dầu</div><h1>Đảo<br><em>Đèn Lồng</em></h1><p id="intro">Cùng Mây gom những đốm sáng giữa màn sương và giữ đèn sáng đến bình minh.</p><button class="primary" id="start">Bắt đầu <span aria-hidden="true">✦</span></button> <button id="scores" class="secondary">Bảng xếp hạng</button> <button id="options" class="secondary">Cài đặt</button></section>
<div id="hud" hidden><div><small>Đèn đã thắp</small><strong id="count"></strong></div><div><small>Đom đóm</small><strong id="bag"></strong></div><div><small>Lửa sống</small><strong id="life"></strong></div><div><small>Còn lại</small><strong id="timer"></strong></div><div><small>Điểm</small><strong id="score"></strong></div></div>
<div id="abilities" hidden></div><div id="guide" hidden></div><div id="shade-alert" role="status" hidden></div><div id="weather" hidden></div><div id="prompt" role="status" hidden></div><footer id="legend"><span><kbd>W A S D</kbd> Di chuyển</span><span><kbd>Space</kbd> Nhảy</span><span><kbd>Shift</kbd> Lướt</span><span><kbd>E</kbd> Nạp đèn</span><span><kbd>F</kbd> Tỏa sáng</span></footer>
<div id="touch" hidden><div class="pad"><button data-key="KeyW" aria-label="Tiến">▲</button><button data-key="KeyA" aria-label="Trái">◀</button><button data-key="KeyS" aria-label="Lùi">▼</button><button data-key="KeyD" aria-label="Phải">▶</button></div><div><button data-key="ShiftLeft">Lướt</button><button data-key="Space">Nhảy</button><button data-key="KeyE">Nạp</button><button data-key="KeyF">Tỏa</button></div></div>
<dialog id="dialog"><h2></h2><p></p><div id="sliders" hidden><label><input type="checkbox" id="palette"> Bảng màu dễ phân biệt</label><label>Âm lượng <input id="volume" type="range" min="0" max="100"></label><label>Độ nhạy chuột <input id="sensitivity" type="range" min="1" max="10"></label><label><input id="reduced" type="checkbox"> Giảm chuyển động</label><label><input id="large" type="checkbox"> Chữ lớn (125%)</label><fieldset><legend>Phím điều khiển</legend><div id="keymap"></div><div id="key-feedback" role="status"></div><button id="defaults">Khôi phục mặc định</button></fieldset></div><form id="save-score" hidden><label>Tên xếp hạng <input name="name" required pattern="[A-Za-z0-9_]{3,12}" minlength="3" maxlength="12" placeholder="May_01"></label><small>3–12 chữ cái A–Z, số hoặc dấu _</small><button>Lưu điểm</button> <output></output></form><ol id="ranking" hidden></ol><div id="actions"></div></dialog>
</main><script type="module" src="/src/main.js"></script></body></html>
